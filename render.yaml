services:
  - type: web
    name: ecoquery-backend
    runtime: python
    region: ohio
    plan: free
    healthCheckPath: /health
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: JWT_SECRET
        sync: false
      - key: KEY_ENCRYPTION_KEY
        generateValue: true
      - key: REDIS_URL
        sync: false
      - key: ELECTRICITY_MAPS_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MONGODB_URL
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://ecoquery.onrender.com/api/auth/google/callback
      - key: FRONTEND_URL
        value: https://eco2query.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://eco2query.vercel.app
      # Swagger/ReDoc/OpenAPI stay unmounted in production; flip to "true"
      # only in a staging service that you want people browsing.
      - key: ENABLE_API_DOCS
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
