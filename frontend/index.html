<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>EcoQuery</title>
    <meta name="description" content="EcoQuery selects the greenest AI model based on real-time carbon intensity data. Track and reduce your AI carbon footprint with intelligent routing and independent verification." />
    <meta name="keywords" content="ecoquery, carbon-aware AI, green AI, LLM routing, sustainable AI, AI carbon tracking, carbon footprint, renewable energy AI, eco-friendly AI, machine learning emissions" />
    <meta name="author" content="EcoQuery Team" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://eco2query.vercel.app/" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://eco2query.vercel.app/" />
    <meta property="og:title" content="EcoQuery" />
    <meta property="og:description" content="Select the greenest AI model based on real-time carbon data. Track and reduce your AI carbon footprint with intelligent routing." />
    <meta property="og:image" content="https://eco2query.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="EcoQuery" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://eco2query.vercel.app/" />
    <meta name="twitter:title" content="EcoQuery" />
    <meta name="twitter:description" content="Select the greenest AI model based on real-time carbon data. Track and reduce your AI carbon footprint." />
    <meta name="twitter:image" content="https://eco2query.vercel.app/og-image.png" />
    
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EcoQuery" />

    <!-- Fonts: preconnect + preload for fast first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "EcoQuery",
      "url": "https://eco2query.vercel.app",
      "description": "Carbon-aware AI model selection that reduces inference emissions with intelligent routing and real-time carbon tracking.",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "creator": {
        "@type": "Organization",
        "name": "EcoQuery",
        "url": "https://eco2query.vercel.app"
      }
    }
    </script>
    
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
