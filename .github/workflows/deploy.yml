name: Deploy EcoQuery

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-backend:
    name: Lint & Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install ruff
      - run: ruff check . --select E,F --ignore E501
      # Guards the catalog the router scores against and prints the digest a
      # benchmark artifact must pin. Fails the build on a stale cost/latency
      # table, a paid model, or an id that no longer matches its threshold key.
      - name: Validate model catalog
        run: python validate_models.py
      - name: Run backend tests with isolated configuration
        env:
          JWT_SECRET: test-jwt-secret-with-at-least-32-characters
          KEY_ENCRYPTION_KEY: test-key-encryption-secret-at-least-32-chars
          MONGODB_URL: mongodb://127.0.0.1:27017/ecoquery-test
          OPENROUTER_API_KEY: test-openrouter-key
          GOOGLE_API_KEY: test-google-key
        run: python -m pytest --maxfail=1 --disable-warnings -q

  lint-test-frontend:
    name: Lint & Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The backup procedure is exercised, not merely documented. A dump that has
  # never been restored proves only that a command exited zero on the day it
  # ran, so this runs the real mongodump/mongorestore against a throwaway
  # database on every push and fails if a single document or index does not
  # round trip. It is independent of the deploy jobs on purpose: a broken
  # drill is worth knowing about, but it is not a reason to hold a release.
  backup-restore-drill:
    name: Backup → Restore Drill
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      # The runner ships no mongodump. Pinned, like the Vercel CLI below, so
      # a tool upgrade is a reviewed change rather than whatever fastdl is
      # serving that afternoon.
      - name: Install MongoDB Database Tools
        run: |
          set -euo pipefail
          TOOLS_VERSION=100.11.0
          curl -fsSL "https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2404-x86_64-${TOOLS_VERSION}.tgz" -o /tmp/mdb-tools.tgz
          tar -xzf /tmp/mdb-tools.tgz -C /tmp
          sudo install -m 0755 "/tmp/mongodb-database-tools-ubuntu2404-x86_64-${TOOLS_VERSION}/bin/"* /usr/local/bin/
          mongodump --version
          mongorestore --version
      - name: Run the backup/restore drill
        run: python scripts/verify_backup_restore.py --uri mongodb://127.0.0.1:27017/

  deploy-frontend:
    name: Deploy Frontend → Vercel
    needs: [lint-test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Install Vercel CLI
        run: npm install --global vercel@59.23.2
      - name: Validate Vercel configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is missing."
            exit 1
          fi
          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "VERCEL_ORG_ID is missing."
            exit 1
          fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "VERCEL_PROJECT_ID is missing."
            exit 1
          fi
          vercel whoami --token="$VERCEL_TOKEN"
      - name: Configure Vercel project link
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          mkdir -p .vercel
          node -e 'const fs = require("fs"); fs.writeFileSync(".vercel/project.json", JSON.stringify({ orgId: process.env.VERCEL_ORG_ID, projectId: process.env.VERCEL_PROJECT_ID }) + "\n");'
      - name: Deploy Vercel production source
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          vercel deploy \
            --prod \
            --local-config=frontend/vercel.json \
            --token="$VERCEL_TOKEN"

  deploy-backend:
    name: Deploy Backend → Render
    needs: [lint-test-backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render Deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not configured in GitHub repository secrets."
            exit 1
          fi
          curl --fail --show-error --silent -X POST "$RENDER_DEPLOY_HOOK_URL"
